<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fatima’s Stitch | للتطريز اليدوي</title><meta name="theme-color" content="#626d4c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Fatima’s Stitch"><meta name="description" content="متجر تجريبي للهدايا المطرزة يدويًا"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><style>:root{--olive:#626d4c;--cream:#f8f5ee;--ink:#35372e;--muted:#777b6c}*{box-sizing:border-box}body{margin:0;background:#e8e6df;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--olive);color:white}button.secondary{background:#e8e9df;color:var(--ink)}button.outline{background:transparent;color:var(--olive);border:1px solid #bbc1ad}input,select,textarea{width:100%;border:1px solid #d8d9cf;border-radius:10px;padding:11px;background:white}label{font-size:13px;color:var(--muted)}.app{max-width:480px;margin:auto;min-height:100vh;background:var(--cream);padding-bottom:85px;box-shadow:0 0 50px #0001}.head{padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:Georgia,serif;font-size:24px;color:var(--olive);font-weight:bold}.tiny{font-size:11px;color:var(--muted)}.hero{margin:10px 16px;background:linear-gradient(125deg,#626d4c,#a2a88a);color:white;border-radius:22px;padding:26px 22px;min-height:170px;position:relative;overflow:hidden}.hero:after{content:'✿';font-size:170px;opacity:.12;position:absolute;left:0;top:-38px}.hero h1{font-size:25px;margin:0 0 10px}.hero p{font-size:13px;line-height:1.8;max-width:250px}.hero button{background:white;color:var(--olive)}.content{padding:14px 16px}.section-title{font-size:19px;margin:8px 0 14px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:9px}.chip{white-space:nowrap;background:#e9e9df;color:var(--olive);padding:9px 14px}.chip.active{background:var(--olive);color:white}.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{background:white;border:1px solid #eeeee7;border-radius:17px;overflow:hidden}.photo{height:135px;background:linear-gradient(140deg,#eee5d8,#d4d7c5);display:grid;place-items:center;font-size:58px}.product .info{padding:12px}.product strong{font-size:14px;display:block;min-height:42px}.price{font-weight:bold;color:var(--olive);margin:8px 0}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;display:flex;justify-content:space-around;background:white;border-top:1px solid #e5e5de;padding:9px 0 max(10px,env(safe-area-inset-bottom))}.nav{background:transparent;color:#7c8174;font-size:12px;padding:6px 10px}.nav.active{color:var(--olive);font-weight:bold}.panel{background:white;border:1px solid #ebede5;border-radius:17px;padding:16px;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.hidden{display:none!important}.badge{background:#e6eadf;color:var(--olive);border-radius:30px;padding:5px 9px;font-size:11px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:white;border-radius:14px;padding:16px}.stat strong{display:block;font-size:23px;color:var(--olive)}.notice{background:#f0ead8;padding:12px;border-radius:12px;font-size:12px;line-height:1.7}.order{border-bottom:1px solid #eee;padding:12px 0}.order:last-child{border:0}.muted{color:var(--muted);font-size:12px}.empty{text-align:center;padding:38px 10px;color:var(--muted)}.full{width:100%}h2{font-size:20px}h3{font-size:16px}small{font-size:11px}.field{display:grid;gap:5px}.qty{display:flex;align-items:center;gap:8px}.qty button{padding:6px 11px}.link{background:none;color:var(--olive);padding:4px}.footer-note{text-align:center;font-size:11px;color:#878b7d;margin:18px}</style></head><body><div class="app"><div style="background:#f0ead8;color:#64562d;text-align:center;font-size:12px;padding:8px 14px">نسخة تجريبية فقط • لا تدخل بيانات عملاء حقيقية أو معلومات دفع</div><header class="head"><div><div class="brand">Fatima’s Stitch ✿</div><div class="tiny">للتطريز اليدوي • صنع بحب</div></div><button class="outline" onclick="go('admin')">⚙ الإدارة</button></header><main id="screen"></main><nav class="bottom"><button class="nav active" data-page="home" onclick="go('home')">⌂ الرئيسية</button><button class="nav" data-page="shop" onclick="go('shop')">▦ المنتجات</button><button class="nav" data-page="cart" onclick="go('cart')">🛍 السلة <span id="cartCount"></span></button><button class="nav" data-page="track" onclick="go('track')">⌕ طلباتي</button></nav></div><script>
const KEY='fatima_stitch_v10';const seed=[{id:1,name:'طارة تطريز باسم مخصص',category:'أطواق',price:85,emoji:'🪡',description:'هدية مطرزة يدويًا بالاسم الذي تختارينه'},{id:2,name:'ميدالية اسم مطرزة',category:'ميداليات',price:45,emoji:'🌸',description:'ميدالية مخصصة بخيط التطريز'},{id:3,name:'بروش وردة يدوية',category:'بروشات',price:35,emoji:'🌼',description:'قطعة فريدة بتفاصيل ناعمة'},{id:4,name:'هدية تطريز خاصة',category:'هدايا',price:110,emoji:'🎁',description:'هدية مخصصة للمناسبات'}];let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!Array.isArray(db.products))db={products:seed,cart:[],orders:[]};let page='home',category='الكل',selected=null;function save(){localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('cartCount').textContent=db.cart.reduce((a,b)=>a+b.qty,0)||''}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return Number(n).toLocaleString('ar-SA')+' ر.س'}function go(p){page=p;selected=null;render();scrollTo(0,0)}function render(){save();document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let s=document.getElementById('screen');if(page==='home')s.innerHTML=`<div class="hero"><h1>هدية تحمل اسمك<br>وتحكي حكايتك</h1><p>تفاصيل مطرزة يدويًا بكل حب، خصيصًا لمن تحبين.</p><button onclick="go('shop')">تسوقي الآن ←</button></div><div class="content"><h2 class="section-title">قطع صنعت بحب ✿</h2><div class="products">${db.products.slice(0,4).map(card).join('')}</div><div class="footer-note">كل غرزة تحكي قصة • Fatima’s Stitch</div></div>`;else if(page==='shop')s.innerHTML=`<div class="content"><h2>اكتشفي منتجاتنا</h2><input id="search" placeholder="ابحثي عن هديتك..." oninput="drawProducts()"><div class="chips" id="chips"></div><div class="products" id="productGrid"></div></div>`,drawProducts();else if(page==='detail')detail();else if(page==='cart')cart();else if(page==='checkout')checkout();else if(page==='track')track();else if(page==='admin')admin();else if(page==='newproduct')newProduct();else if(page==='adminorders')adminOrders();else if(page==='success')s.innerHTML=`<div class="content"><div class="panel" style="text-align:center;padding:40px 16px"><div style="font-size:55px">🌷</div><h2>شكرًا لطلبك!</h2><p>هذا طلب تجريبي لم يُرسل إلى المتجر.</p><strong id="lastOrder">${esc(db.orders.at(-1)?.id||'')}</strong><p class="muted">احتفظي برقم الطلب لتجربة التتبع على هذا الجهاز</p><button onclick="go('track')">تتبعي الطلب</button></div></div>`}
function card(p){return `<article class="product"><div class="photo">${esc(p.emoji||'🧵')}</div><div class="info"><strong>${esc(p.name)}</strong><div class="price">${money(p.price)}</div><button class="full" onclick="openProduct(${p.id})">التفاصيل والتخصيص</button></div></article>`}function drawProducts(){let cats=['الكل',...new Set(db.products.map(x=>x.category))];document.getElementById('chips').innerHTML=cats.map(c=>`<button class="chip ${category===c?'active':''}" onclick="category=${JSON.stringify(c).replace(/"/g,'&quot;')};drawProducts()">${esc(c)}</button>`).join('');let q=(document.getElementById('search')?.value||'').trim();let arr=db.products.filter(x=>(category==='الكل'||x.category===category)&&x.name.includes(q));document.getElementById('productGrid').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">لا توجد منتجات مطابقة</div>'}function openProduct(id){selected=id;page='detail';detail()}function detail(){let p=db.products.find(x=>x.id===selected);if(!p)return go('shop');document.getElementById('screen').innerHTML=`<div class="content"><button class="link" onclick="go('shop')">→ رجوع للمنتجات</button><div class="photo" style="height:235px;border-radius:18px">${esc(p.emoji)}</div><h2>${esc(p.name)}</h2><p>${esc(p.description||'قطعة مطرزة يدويًا')}</p><h2 style="color:var(--olive)">${money(p.price)}</h2><div class="panel stack"><div class="field"><label>الاسم المطلوب تطريزه (اختياري)</label><input id="customName" maxlength="35" placeholder="مثال: فاطمة"></div><div class="field"><label>لون الخيط</label><select id="thread"><option>زيتي</option><option>وردي</option><option>بيج</option><option>أبيض</option><option>حسب اختيار المصممة</option></select></div><div class="field"><label>ملاحظات إضافية</label><textarea id="notes" rows="2" placeholder="تفاصيل الهدية أو المناسبة"></textarea></div><button onclick="addCart(${p.id})">أضيفي إلى السلة</button></div></div>`}function addCart(id){let p=db.products.find(x=>x.id===id);db.cart.push({id:p.id,name:p.name,price:p.price,emoji:p.emoji,custom:document.getElementById('customName').value,thread:document.getElementById('thread').value,notes:document.getElementById('notes').value,qty:1});go('cart')}function cart(){let total=db.cart.reduce((a,x)=>a+x.price*x.qty,0);document.getElementById('screen').innerHTML=`<div class="content"><h2>سلة المشتريات</h2>${db.cart.length?db.cart.map((x,i)=>`<div class="panel"><div class="row"><div style="font-size:35px">${esc(x.emoji)}</div><div style="flex:1"><strong>${esc(x.name)}</strong><div class="muted">${esc(x.custom||'بدون اسم')} • ${esc(x.thread)}</div><div>${money(x.price)}</div></div><div class="qty"><button class="secondary" onclick="changeQty(${i},-1)">−</button>${x.qty}<button class="secondary" onclick="changeQty(${i},1)">+</button></div></div></div>`).join('')+`<div class="panel"><div class="row"><strong>الإجمالي</strong><strong>${money(total)}</strong></div><p class="muted">لا يشمل الشحن، ويحدد لاحقًا.</p><button class="full" onclick="go('checkout')">إتمام الطلب التجريبي</button></div>`:'<div class="empty">سلتك فارغة 🌷<p><button onclick="go(\'shop\')">تصفحي المنتجات</button></p></div>'}</div>`}function changeQty(i,d){db.cart[i].qty+=d;if(db.cart[i].qty<1)db.cart.splice(i,1);render()}function checkout(){if(!db.cart.length)return go('cart');document.getElementById('screen').innerHTML=`<div class="content"><h2>إتمام الطلب</h2><div class="notice">نسخة عرض فقط: لا ترسلي معلومات حساسة. لا يوجد دفع إلكتروني أو إرسال طلب فعلي.</div><form class="panel stack" onsubmit="placeOrder(event)"><div class="field"><label>الاسم</label><input id="buyer" required maxlength="60" placeholder="اسم العميلة"></div><div class="field"><label>رقم التواصل (اختياري للتجربة)</label><input id="phone" inputmode="tel" placeholder="05xxxxxxxx"></div><div class="field"><label>طريقة الاستلام</label><select id="delivery"><option>توصيل (تحدد التكلفة لاحقًا)</option><option>استلام شخصي (حسب الاتفاق)</option></select></div><div class="field"><label>تاريخ مناسب (طلب غير ملزم)</label><input id="date" type="date"></div><button type="submit">تأكيد الطلب التجريبي</button></form></div>`}function placeOrder(e){e.preventDefault();let id='FS-'+String(Date.now()).slice(-8);db.orders.push({id,buyer:document.getElementById('buyer').value,phone:document.getElementById('phone').value,delivery:document.getElementById('delivery').value,date:document.getElementById('date').value,items:structuredClone(db.cart),total:db.cart.reduce((a,x)=>a+x.price*x.qty,0),status:'جديد',created:new Date().toISOString()});db.cart=[];go('success')}function track(){document.getElementById('screen').innerHTML=`<div class="content"><h2>تتبعي طلبك</h2><div class="panel stack"><label>رقم الطلب التجريبي</label><input id="trackId" placeholder="FS-XXXXXXXX"><button onclick="lookup()">بحث</button></div><div id="trackResult"></div><div class="notice">التتبع يعمل على الجهاز نفسه فقط، وليس عبر أجهزة العملاء.</div></div>`}function lookup(){let id=document.getElementById('trackId').value.trim().toUpperCase(),o=db.orders.find(x=>x.id===id);document.getElementById('trackResult').innerHTML=o?`<div class="panel"><strong>${esc(o.id)}</strong><p>حالة الطلب: <span class="badge">${esc(o.status)}</span></p><p>الإجمالي: ${money(o.total)}</p></div>`:'<div class="panel">لم يتم العثور على الطلب على هذا الجهاز.</div>'}function admin(){let total=db.orders.filter(o=>o.status!=='ملغي').reduce((a,o)=>a+o.total,0);document.getElementById('screen').innerHTML=`<div class="content"><h2>لوحة أم العيال 🌷</h2><div class="notice">وضع عرض غير محمي بكلمة مرور. لا تستخدميه لاستقبال طلبات حقيقية أو تخزين بيانات عملاء.</div><div class="summary" style="margin:12px 0"><div class="stat">المنتجات<strong>${db.products.length}</strong></div><div class="stat">الطلبات التجريبية<strong>${db.orders.length}</strong></div><div class="stat">قيمة الطلبات غير الملغاة<strong style="font-size:17px">${money(total)}</strong></div><div class="stat">قيد التطريز<strong>${db.orders.filter(x=>x.status==='قيد التطريز').length}</strong></div></div><div class="stack"><button onclick="go('newproduct')">＋ إضافة منتج</button><button class="secondary" onclick="go('adminorders')">📦 إدارة الطلبات</button><button class="outline" onclick="exportData()">↓ تصدير نسخة احتياطية JSON</button></div><h3>المنتجات</h3>${db.products.map(p=>`<div class="panel row"><span>${esc(p.emoji)} ${esc(p.name)}<div class="muted">${money(p.price)}</div></span><button class="outline" onclick="editProduct(${p.id})">تعديل</button></div>`).join('')}</div>`}let editId=null;function editProduct(id){editId=id;go('newproduct')}function newProduct(){let p=db.products.find(x=>x.id===editId);document.getElementById('screen').innerHTML=`<div class="content"><button class="link" onclick="editId=null;go('admin')">→ رجوع</button><h2>${p?'تعديل المنتج':'إضافة منتج'}</h2><form class="panel stack" onsubmit="saveProduct(event)"><div class="field"><label>اسم المنتج</label><input id="pn" required value="${esc(p?.name||'')}"></div><div class="field"><label>القسم</label><select id="pc">${['أطواق','ميداليات','بروشات','هدايا'].map(c=>`<option ${p?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>السعر بالريال</label><input id="pp" type="number" min="1" step="0.01" required value="${p?.price||''}"></div><div class="field"><label>وصف المنتج</label><textarea id="pd">${esc(p?.description||'')}</textarea></div><div class="field"><label>رمز مؤقت للمنتج</label><input id="pe" maxlength="4" value="${esc(p?.emoji||'🧵')}"></div><button>حفظ المنتج</button></form></div>`}function saveProduct(e){e.preventDefault();let p={id:editId||Date.now(),name:document.getElementById('pn').value,category:document.getElementById('pc').value,price:Number(document.getElementById('pp').value),description:document.getElementById('pd').value,emoji:document.getElementById('pe').value||'🧵'};if(editId)db.products=db.products.map(x=>x.id===editId?p:x);else db.products.push(p);editId=null;go('admin')}function adminOrders(){document.getElementById('screen').innerHTML=`<div class="content"><button class="link" onclick="go('admin')">→ رجوع</button><h2>الطلبات التجريبية</h2>${db.orders.length?db.orders.slice().reverse().map(o=>`<div class="panel"><div class="row"><strong>${esc(o.id)}</strong><span class="badge">${esc(o.status)}</span></div><p>${esc(o.buyer)} • ${money(o.total)}</p><div class="muted">${o.items.map(x=>esc(x.name)+' ('+esc(x.custom||'بدون اسم')+')').join('، ')}</div><div class="field" style="margin-top:12px"><label>تغيير الحالة</label><select onchange="setStatus('${o.id}',this.value)">${['جديد','قيد التطريز','جاهز للتسليم','مكتمل','ملغي'].map(v=>`<option ${o.status===v?'selected':''}>${v}</option>`).join('')}</select></div></div>`).join(''):'<div class="empty">لا توجد طلبات تجريبية بعد.</div>'}</div>`}function setStatus(id,v){let o=db.orders.find(x=>x.id===id);if(o)o.status=v;render()}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Fatimas_Stitch_demo_backup.json';a.click();URL.revokeObjectURL(a.href)}render();</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn))}</script></body></html>
